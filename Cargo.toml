[package]
name = "burn-attnres"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Attention Residuals for Burn - learned depth-wise attention over layer outputs (Moonshot/Kimi)"
keywords = ["burn", "attention", "residual", "transformer", "depth"]
repository = "https://github.com/sehaxe/burn-attnres"
homepage = "https://github.com/sehaxe/burn-attnres"
readme = "README.md"

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std", "burn/cpu"]
cuda = ["dep:burn-cuda", "dep:burn-cubecl", "dep:cubecl", "burn/cuda", "burn-tensor/cuda"]

[dependencies]
burn = { version = "0.22.0-pre.1", default-features = false, features = ["std", "extension"] }
burn-tensor = { version = "0.22.0-pre.1", default-features = false }
burn-cuda = { version = "0.22.0-pre.1", optional = true, default-features = false }
burn-cubecl = { version = "0.22.0-pre.1", optional = true, default-features = false }
cubecl = { version = "0.11.0-pre.1", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
burn-ndarray = { version = "0.22.0-pre.1", features = ["blas-openblas"] }

[package.metadata.docs.rs]
all-features = true
